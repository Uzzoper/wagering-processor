name: wagering-processor

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

volumes:
  pgdata:
